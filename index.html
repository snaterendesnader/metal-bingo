<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Metal Bingo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #111; --fg: #eee; --tile: #f2f2f2; --ink: #111;
    --mark: #c00; --line: #ffcc00; --error: #f66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    height: 100dvh; padding: 8px 8px max(8px, env(safe-area-inset-bottom));
    background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif;
  }
  h1 { margin: 0; font-size: 1.4rem; letter-spacing: .1em; text-transform: uppercase; }
  #banner { min-height: 1.2em; margin: 0; font-size: 1.8rem; font-weight: 900; color: var(--line); }
  #message { margin: 0; color: var(--error); text-align: center; }
  #message:empty { display: none; }
  #board {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    width: min(100%, calc(100dvh - 10rem));
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    aspect-ratio: 1; min-width: 0; overflow: hidden; padding: 3px;
    border: 0; border-radius: 6px; background: var(--tile); color: var(--ink); font: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .cell img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  .cell span {
    max-height: 2.2em; overflow: hidden;
    font-size: .55rem; line-height: 1.1; text-align: center; overflow-wrap: anywhere;
  }
  .cell.nologo span { max-height: none; font-size: .68rem; font-weight: 700; -webkit-hyphens: auto; hyphens: auto; }
  .cell.free { font-size: 2rem; }
  .cell.marked { background: var(--mark); color: #fff; }
  .cell.marked img { filter: invert(1); }
  .cell.line { background: var(--line); color: var(--ink); }
  .cell.line img { filter: none; }
  /* Effecten */
  @keyframes pop { 50% { transform: scale(1.18); } }
  .cell.pop { animation: pop .25s ease-out; }
  @keyframes glow {
    40% { transform: scale(1.15); box-shadow: 0 0 24px 8px #ff6600; }
  }
  .cell.glow { position: relative; z-index: 1; animation: glow .5s ease-out both; }
  @keyframes slam {
    0% { transform: scale(4) rotate(-12deg); opacity: 0; }
    60% { transform: scale(.9) rotate(3deg); opacity: 1; }
    100% { transform: none; }
  }
  #banner.slam { animation: slam .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes shake {
    20%, 60% { transform: translate(-6px, 2px); }
    40%, 80% { transform: translate(6px, -2px); }
  }
  #board.shake { animation: shake .4s; }
  .fx { position: fixed; z-index: 10; pointer-events: none; }
  @keyframes float-up {
    from { transform: translate(-50%, -50%); opacity: 1; }
    to { transform: translate(-50%, calc(-50% - 110px)) scale(1.8); opacity: 0; }
  }
  .fx.float { font-size: 2rem; animation: float-up .9s ease-out forwards; }
  @keyframes flash { 0%, 40%, 100% { opacity: 0; } 10%, 55% { opacity: .85; } }
  .fx.flash { inset: 0; background: #fff; animation: flash .45s linear forwards; }
  @keyframes fall { to { transform: translateY(calc(100vh + 4rem)) rotate(var(--spin)); } }
  .fx.rain { top: -3rem; font-size: 1.8rem; animation: fall var(--dur) linear var(--delay) both; }
  @keyframes burn {
    0%, 100% { opacity: 0; transform: translateY(100%); }
    15%, 80% { opacity: 1; transform: none; }
  }
  .fx.flames {
    left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
    font-size: 2.4rem; animation: burn 4s ease-in-out forwards;
  }
  @keyframes flicker { to { transform: scaleY(1.35) translateY(-6px); } }
  .fx.flames span { display: inline-block; transform-origin: bottom; animation: flicker .3s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) {
    .cell.pop, .cell.glow, #banner.slam, #board.shake { animation: none; }
    .fx { display: none; }
  }
  #new {
    margin-top: auto; padding: 12px 24px;
    border: 2px solid var(--fg); border-radius: 8px;
    background: transparent; color: var(--fg); font: inherit; font-weight: 700;
  }
</style>
</head>
<body>
<h1>Metal Bingo</h1>
<p id="banner" role="status" aria-live="polite"></p>
<p id="message" role="alert"></p>
<div id="board"></div>
<button id="new" type="button">Nieuwe kaart</button>
<script src="app.js" defer></script>
</body>
</html>
